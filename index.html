<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ana Wyak ❤️</title><style>body{margin:0;background:#0b141a;font-family:sans-serif;color:#fff;display:flex;flex-direction:column;height:100vh}#head{background:#202c33;padding:15px;text-align:center;color:#25D366;font-weight:bold}#chat{flex:1;overflow-y:auto;padding:12px;padding-bottom:80px}.msg{padding:10px 14px;border-radius:12px;margin:6px 0;max-width:75%}.you{background:#005c4b;margin-left:auto}.other{background:#202c33}#box{position:fixed;bottom:0;width:100%;background:#202c33;display:flex;padding:8px;box-sizing:border-box}input{flex:1;background:#2a3942;border:none;border-radius:20px;padding:12px 16px;color:#fff;outline:none}button{background:#25D366;border:none;border-radius:50%;width:46px;height:46px;margin-left:8px;font-size:20px;color:#fff}</style><script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script></head><body><div id="head">Ana Wyak ❤️ - Private</div><div id="chat"></div><div id="box"><input id="txt" placeholder="Ktab hna..."><button onclick="send()">➤</button></div><script>let n=localStorage.getItem('smiya')||prompt('Smitk?')||'Ana';localStorage.setItem('smiya',n);const gun=Gun(['https://gun-manhattan.herokuapp.com/gun']);const chat=gun.get('ana-wyak-chahbi2002-private');const div=document.getElementById('chat');chat.map().on((d,id)=>{if(!d||!d.text||document.getElementById(id))return;let m=document.createElement('div');m.id=id;m.className=d.name==n?'msg you':'msg other';m.innerText=d.name+': '+d.text;div.appendChild(m);div.scrollTop=div.scrollHeight});function send(){let t=document.getElementById('txt').value;if(!t)return;chat.set({name:n,text:t});document.getElementById('txt').value=''}document.getElementById('txt').addEventListener('keydown',e=>{if(e.key=='Enter')send()});</script></body></html>
