<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ana Wyak 📸</title><style>body{margin:0;background:#000;color:#fff;font-family:sans-serif}#login{display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;background:#111}#login div{background:#202c33;padding:25px;border-radius:16px;width:85%;max-width:300px;text-align:center}input{width:100%;background:#2a3942;border:none;border-radius:10px;padding:14px;margin:8px 0;color:#fff;box-sizing:border-box}button{width:100%;background:#e91e63;border:none;border-radius:10px;padding:14px;color:#fff;font-weight:bold;margin-top:10px}#top{display:none;background:#202c33;padding:12px;text-align:center;position:fixed;top:0;width:100%;z-index:10}#feed{display:none;padding:60px 10px 80px 10px;column-count:2;gap:10px;background:#000;min-height:100vh;box-sizing:border-box}.pic{width:100%;border-radius:12px;margin-bottom:10px;display:block}#bar{display:none;position:fixed;bottom:0;width:100%;background:#202c33;padding:10px;justify-content:space-around;box-sizing:border-box}label{background:#e91e63;padding:12px 25px;border-radius:25px;font-weight:bold}</style><script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script></head><body><div id="login"><div><h2 style="color:#e91e63">Ana Wyak 📸</h2><p style="opacity:.6">غرفة تصاور سرية</p><input id="n1" placeholder="نمرتك"><input id="n2" placeholder="نمرتها"><input id="nm" placeholder="سميتك"><button onclick="dkhal()">دخول ❤️</button></div></div><div id="top"></div><div id="feed"></div><div id="bar"><label>📸 صوّر<input type="file" id="f" accept="image/*" capture="camera" style="display:none" onchange="upload(this)"></label></div><script>let gun=Gun({peers:['https://relay.peer.ooo/gun']});let chat,myName;function dkhal(){let a=document.getElementById('n1').value.trim(),b=document.getElementById('n2').value.trim(),nm=document.getElementById('nm').value.trim();if(a.length<5||b.length<5||!nm)return alert('عمر كلشي');let room=[a,b].sort().join('_');localStorage.setItem('room',room);localStorage.setItem('myname',nm);start(room,nm)}function start(room,nm){myName=nm;document.getElementById('login').style.display='none';document.getElementById('top').style.display='block';document.getElementById('feed').style.display='block';document.getElementById('bar').style.display='flex';document.getElementById('top').innerText='📸 '+nm+' ❤️';chat=gun.get('ana-wyak-PICS-'+room);let feed=document.getElementById('feed');chat.map().on((v,k)=>{if(!v||!v.img||document.getElementById(k))return;let im=document.createElement('img');im.id=k;im.className='pic';im.src=v.img;feed.prepend(im);});}function upload(inp){let file=inp.files[0];if(!file)return;let r=new FileReader();r.onload=e=>{chat.set({name:myName,img:e.target.result,time:Date.now()});};r.readAsDataURL(file);}let rr=localStorage.getItem('room'),rnn=localStorage.getItem('myname');if(rr&&rnn)start(rr,rnn);</script></body></html>
